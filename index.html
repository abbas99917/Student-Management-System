<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Management System</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">

    <header>
      <h1>Student Management System</h1>
      <p>Manage student information easily</p>
    </header>

    <section class="form-section">
      <h2 >Add Student</h2>

      <form id="studentForm">

        <div class="input-group">
          <label>Student Name</label>
          <input type="text" id="studentName" placeholder="Enter student name">
        </div>

        <div class="input-group">
          <label>Age</label>
          <input type="number" id="studentAge" placeholder="Enter age">
        </div>

        <div class="input-group">
          <label>Course</label>
          <input type="text" id="studentCourse" placeholder="Enter course">
        </div>
        <div class="input-group">
          <label>Marks</label>
          <input type="number" id="studentMarks" placeholder="Enter marks">
        </div>
        <button type="button" id="addStudentBtn">Add Student</button>
      </form>
    </section>

    <section class="students-section">
      <div class="section-header">
        <h2>Students</h2>
        <input 
          type="text" 
          id="searchStudent" 
          placeholder="Search student..."
        >
      </div>
      <div class="students-container" id="studentsContainer"></div>
    </section>
  </div>


  <script src="main.js"></script>
</body>
</html>
